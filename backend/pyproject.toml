[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clarus-backend"
version = "0.2.0"
description = "Maximum-accuracy RAG search engine for sacred texts"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Clarus Contributors" }
]

dependencies = [
    "qdrant-client>=1.7.0",
    "grpcio>=1.59.0",
    "fastembed>=0.2.0",
    "requests>=2.28.0",
    "aiohttp>=3.8.0",
    "tqdm>=4.65.0",
    "rich>=15.0.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "tenacity>=8.2.0",
    "pybreaker>=1.0.0",
    "redis[hiredis]>=5.0.0",
    "redisvl>=0.7.0",
    "zeyrek>=0.1.0",
    "tashaphyne>=0.3.0",
    "pyarabic>=0.6.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sse-starlette>=2.0.0",
    "pydantic-settings>=2.1.0",
    "sentry-sdk[fastapi]",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.18.0",
    "PyJWT[crypto]>=2.8.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.22",
    "httpx>=0.26.0",
    "cachetools>=5.3.0",
    "psycopg2-binary>=2.9.11",
    # Security: Pin minimum secure versions for transitive dependencies
    "pillow>=12.1.1",
    "cryptography>=46.0.5",
    "defusedxml>=0.7.1",
    # gitpython: previously pulled in by truffleHog (legacy secret scanner, now replaced by gitleaks).
    # Pinned to >=3.1.41 to fix PYSEC-2022-42992, PYSEC-2023-137, PYSEC-2023-161,
    # PYSEC-2023-165, PYSEC-2024-4. truffleHog removed from venv (see pre-commit-config.yaml).
    "gitpython>=3.1.41",
    "polar-sdk>=0.28.4",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
    "pytest-asyncio>=0.24.0",
    "pip-audit>=2.10.0",
    "schemathesis>=4.10.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "requires_db: test requires a running PostgreSQL database (skipped in CI)",
]
addopts = [
    "--ignore-glob=tests/run_*.py",
    "--ignore-glob=tests/*_verification_test.py",
    "--ignore-glob=tests/*_comprehensive_test.py",
    "--ignore-glob=tests/test_multi_agent_flow.py",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.bandit]
exclude_dirs = ["/tests", "/.venv", "/postgres_data", "/qdrant_data", "/__pycache__"]
skips = ["B101"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    # Core
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    # Import
    "I",      # isort
    # Naming
    "N",      # pep8-naming
    # Modernization
    "UP",     # pyupgrade
    # Security (replaces standalone bandit)
    "S",      # flake8-bandit
    # Bugs
    "B",      # flake8-bugbear
    # Built-ins
    "A",      # flake8-builtins
    # Comprehensions
    "C4",     # flake8-comprehensions
    # Datetime
    "DTZ",    # flake8-datetimez
    # Print
    "T20",    # flake8-print
    # Simplify
    "SIM",    # flake8-simplify
    # Type checking
    "TCH",    # flake8-type-checking
    # Async
    "ASYNC",  # flake8-async
    # Performance
    "PERF",   # perflint
    # Misc
    "PIE",    # flake8-pie
    "PGH",    # pygrep-hooks
    "RUF",    # Ruff-specific
]

ignore = [
    "E501",    # Line too long (formatter handles)
    "S104",    # Possible binding to all interfaces (dev servers)
    "S108",    # Probable insecure /tmp usage (false positives)
    "B008",    # Function call in default arg (FastAPI Depends pattern)
    "UP007",   # Use X | Y for union (Python 3.9 compat)
    "RUF001",  # Ambiguous Unicode — project handles Arabic/Hebrew/Greek text
    "RUF002",  # Ambiguous Unicode docstring — same reason
    "RUF003",  # Ambiguous Unicode comment — same reason
    "RUF012",  # Mutable class variables (Pydantic models)
    "DTZ003",  # datetime.utcnow() — widespread, migrate separately
    "DTZ005",  # datetime.now() without tz — migrate separately
    "B904",    # raise from — migrate separately
    "SIM108",  # Use ternary — style preference
    "N813",    # camelCase imported as lowercase — third-party naming
    "N806",    # Variable in function should be lowercase — false positives
    "S314",    # xml.etree — safe for trusted data in this project
    "S310",    # urllib audit — URL parsing, not user input
    "T201",    # print() — CLI tool uses Rich console + print extensively
    "S608",    # SQL injection via f-string — SQLAlchemy text() patterns
    "S324",    # MD5/SHA1 — used for hashing, not security
    "ASYNC230", # open() in async — sync file I/O in data loaders
    "ASYNC221", # sync HTTP call in async — wrapped by aiohttp

    "PERF401", # list comprehension — style preference, migrate separately
    "SIM105",  # contextlib.suppress — style preference
    "SIM102",  # collapsible-if — readability preference
    "SIM115",  # open-file-with-context-handler — data loader patterns
    "B023",    # function-uses-loop-variable — false positive in closures
    "B039",    # mutable-contextvar-default — false positive
    "PGH003",  # blanket-type-ignore — legacy type: ignore comments
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/**/*.py" = ["S101", "S105", "S106", "S110", "S311", "S603", "S607", "PLR2004", "T20", "ASYNC"]
"scripts/**/*.py" = ["S101", "T20", "S603", "S607", "B007"]
"main.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["app", "src"]

[tool.ruff.lint.flake8-type-checking]
strict = true
