[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clarus-backend"
version = "0.1.0"
description = "Maximum-accuracy RAG search engine for sacred texts"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Clarus Contributors" }
]

dependencies = [
    "qdrant-client>=1.7.0",
    "grpcio>=1.59.0",
    "fastembed>=0.2.0",
    "requests>=2.28.0",
    "aiohttp>=3.8.0",
    "tqdm>=4.65.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "tenacity>=8.2.0",
    "pybreaker>=1.0.0",
    "redis[hiredis]>=5.0.0",
    "redisvl>=0.7.0",
    "zeyrek>=0.1.0",
    "tashaphyne>=0.3.0",
    "pyarabic>=0.6.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sse-starlette>=2.0.0",
    "pydantic-settings>=2.1.0",
    "sentry-sdk[fastapi]",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.18.0",
    "PyJWT[crypto]>=2.8.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.22",
    "httpx>=0.26.0",
    "cachetools>=5.3.0",
]

[dependency-groups]
dev = ["pytest>=7.0.0", "ruff>=0.8.0", "pyright>=1.1.390"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
include = ["src", "app"]
exclude = ["tests"]
