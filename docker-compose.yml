services:
  # PostgreSQL via Supabase Local
  postgres:
    image: supabase/postgres:15.1.0.147
    container_name: holly-postgres
    restart: unless-stopped
    ports:
      - "54322:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: holly-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

  # Redis Stack for Caching
  redis:
    image: redis/redis-stack:7.2.0-v13
    container_name: holly-redis
    restart: unless-stopped
    ports:
      # Bind to 127.0.0.1 only — never expose Redis to all interfaces on the host.
      # This prevents access from external networks even if the host firewall is misconfigured.
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:8001:8001"
    volumes:
      - ./redis_data:/data
      - ./redis.conf:/redis-stack.conf:ro
    environment:
      # Set REDIS_PASSWORD in your shell or .env to enable Redis authentication.
      # Strongly recommended in production: openssl rand -hex 32
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    command: >
      sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          redis-server /redis-stack.conf --requirepass "$$REDIS_PASSWORD";
        else
          redis-server /redis-stack.conf --protected-mode no;
        fi'
    healthcheck:
      # Use password-aware ping: if REDIS_PASSWORD is set, authenticate first.
      test: ["CMD-SHELL", "[ -z \"$$REDIS_PASSWORD\" ] && redis-cli ping || redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5

