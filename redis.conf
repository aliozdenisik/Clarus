# Redis Stack Configuration for Clarus
# Memory
maxmemory 2gb
maxmemory-policy allkeys-lru

# Persistence - RDB snapshots
save 900 1
save 300 10
save 60 10000

# Persistence - AOF
appendonly yes
appendfsync everysec

# Network
bind 0.0.0.0
protected-mode no
tcp-keepalive 300

# Logging
loglevel notice
