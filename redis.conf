# Redis Stack Configuration for Clarus
# Memory
maxmemory 2gb
maxmemory-policy allkeys-lru

# Persistence - RDB snapshots
save 900 1
save 300 10
save 60 10000

# Persistence - AOF
appendonly yes
appendfsync everysec

# Network
# bind to all interfaces inside the container; external access is restricted
# to 127.0.0.1 via docker-compose port bindings (see docker-compose.yml).
# When REDIS_PASSWORD is set via docker-compose, --requirepass is passed at
# startup and protected-mode enforces authentication for non-loopback clients.
bind 0.0.0.0
protected-mode yes
tcp-keepalive 300

# Logging
loglevel notice
