<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Holly Search: Ana Arama</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#007bff",
                        "background-light": "#f5f7f8",
                        "background-dark": "#0f1923",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem", // 2px - sharp edges
                        "lg": "0.25rem", 
                        "xl": "0.5rem", 
                        "full": "0.75rem"
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark text-[#101418] dark:text-white font-display">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
<!-- Top Navigation -->
<header class="flex items-center justify-between border-b border-solid border-[#e5e7eb] dark:border-[#2a3b47] px-6 py-4 lg:px-10">
<div class="flex items-center gap-3">
<div class="flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-3xl">menu_book</span>
</div>
<h2 class="text-[#101418] dark:text-white text-xl font-bold tracking-tight">Holly Search</h2>
</div>
<button class="flex items-center justify-center rounded bg-transparent p-2 text-[#5e758d] hover:bg-[#e5e7eb] dark:hover:bg-[#2a3b47] transition-colors">
<span class="material-symbols-outlined">settings</span>
</button>
</header>
<!-- Main Content -->
<main class="flex flex-1 flex-col items-center justify-center px-4 py-12 sm:px-6 lg:px-8">
<div class="flex w-full max-w-[800px] flex-col items-center gap-10">
<!-- Hero Text -->
<div class="flex flex-col items-center gap-4 text-center">
<div class="mb-2 flex h-16 w-16 items-center justify-center rounded-full bg-primary/10 text-primary">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
<h1 class="text-4xl font-black leading-tight tracking-tight text-[#101418] dark:text-white sm:text-5xl lg:text-6xl">
                        Unlock the wisdom of the texts
                    </h1>
<p class="text-lg font-normal text-[#5e758d] dark:text-[#94a3b8] sm:text-xl">
                        Ask about patience, creation, or law across the Quran, Bible, and Torah.
                    </p>
</div>
<!-- Search Container -->
<div class="w-full flex flex-col gap-4">
<!-- Search Mode Toggles -->
<div class="flex justify-center">
<div class="inline-flex rounded bg-[#e5e7eb] dark:bg-[#1e293b] p-1">
<label class="group relative flex cursor-pointer items-center justify-center rounded px-4 py-1.5 text-sm font-medium transition-all has-[:checked]:bg-white dark:has-[:checked]:bg-[#2a3b47] has-[:checked]:text-primary has-[:checked]:shadow-sm">
<span class="mr-2 material-symbols-outlined text-[18px]">psychology</span>
<span class="truncate">Semantic</span>
<input checked="" class="invisible absolute w-0" name="search-mode" type="radio" value="Semantic"/>
</label>
<label class="group relative flex cursor-pointer items-center justify-center rounded px-4 py-1.5 text-sm font-medium text-[#5e758d] dark:text-[#94a3b8] transition-all has-[:checked]:bg-white dark:has-[:checked]:bg-[#2a3b47] has-[:checked]:text-primary has-[:checked]:shadow-sm">
<span class="mr-2 material-symbols-outlined text-[18px]">find_in_page</span>
<span class="truncate">Keyword</span>
<input class="invisible absolute w-0" name="search-mode" type="radio" value="Keyword"/>
</label>
</div>
</div>
<!-- Main Search Input -->
<label class="relative flex w-full flex-col shadow-sm">
<div class="flex w-full items-stretch rounded border border-[#dae0e7] dark:border-[#2a3b47] bg-white dark:bg-[#1e293b] transition-colors focus-within:border-primary focus-within:ring-1 focus-within:ring-primary h-16">
<div class="flex items-center justify-center pl-4 text-[#5e758d] dark:text-[#94a3b8]">
<span class="material-symbols-outlined text-2xl">search</span>
</div>
<input class="flex w-full min-w-0 flex-1 resize-none bg-transparent px-4 py-2 text-base font-normal text-[#101418] dark:text-white placeholder:text-[#94a3b8] focus:outline-0" placeholder="What does the text say about forgiveness?" value=""/>
<div class="flex items-center justify-center pr-2">
<button class="flex min-w-[100px] cursor-pointer items-center justify-center gap-2 rounded bg-primary px-5 py-2.5 text-sm font-bold text-white transition-colors hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-offset-1">
<span>Search</span>
</button>
</div>
</div>
</label>
<!-- Chips -->
<div class="mt-2 flex flex-wrap justify-center gap-3">
<button class="flex items-center gap-2 rounded border border-[#e5e7eb] dark:border-[#2a3b47] bg-white dark:bg-[#1e293b] px-4 py-2 text-sm font-medium text-[#5e758d] dark:text-[#94a3b8] transition-colors hover:border-primary hover:text-primary dark:hover:text-primary">
<span class="material-symbols-outlined text-[18px]">schedule</span>
                            Concept of Time
                        </button>
<button class="flex items-center gap-2 rounded border border-[#e5e7eb] dark:border-[#2a3b47] bg-white dark:bg-[#1e293b] px-4 py-2 text-sm font-medium text-[#5e758d] dark:text-[#94a3b8] transition-colors hover:border-primary hover:text-primary dark:hover:text-primary">
<span class="material-symbols-outlined text-[18px]">group</span>
                            Prophets
                        </button>
<button class="flex items-center gap-2 rounded border border-[#e5e7eb] dark:border-[#2a3b47] bg-white dark:bg-[#1e293b] px-4 py-2 text-sm font-medium text-[#5e758d] dark:text-[#94a3b8] transition-colors hover:border-primary hover:text-primary dark:hover:text-primary">
<span class="material-symbols-outlined text-[18px]">volunteer_activism</span>
                            Charity
                        </button>
<button class="flex items-center gap-2 rounded border border-[#e5e7eb] dark:border-[#2a3b47] bg-white dark:bg-[#1e293b] px-4 py-2 text-sm font-medium text-[#5e758d] dark:text-[#94a3b8] transition-colors hover:border-primary hover:text-primary dark:hover:text-primary">
<span class="material-symbols-outlined text-[18px]">restaurant</span>
                            Dietary Laws
                        </button>
</div>
</div>
</div>
</main>
<!-- Footer -->
<footer class="flex flex-col items-center justify-center gap-6 border-t border-[#e5e7eb] dark:border-[#2a3b47] bg-white dark:bg-[#0f1923] py-8 text-center sm:flex-row sm:justify-between sm:px-10">
<p class="text-sm font-medium text-[#5e758d] dark:text-[#94a3b8]">© 2024 Holly Search. Indexing Quran, Bible, and Torah.</p>
<div class="flex gap-6">
<a class="text-sm font-medium text-[#5e758d] transition-colors hover:text-primary dark:text-[#94a3b8] dark:hover:text-primary" href="#">About</a>
<a class="text-sm font-medium text-[#5e758d] transition-colors hover:text-primary dark:text-[#94a3b8] dark:hover:text-primary" href="#">Sources</a>
<a class="text-sm font-medium text-[#5e758d] transition-colors hover:text-primary dark:text-[#94a3b8] dark:hover:text-primary" href="#">Privacy</a>
</div>
</footer>
</div>
</body></html>
