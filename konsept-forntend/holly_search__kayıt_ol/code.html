<!DOCTYPE html>

<html class="light" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Holly Search: Kayıt Ol</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137cec",
                        "background-light": "#f8f9fa", /* Very light grey/white for purity */
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem", // Sharp-ish 2px
                        "sm": "0.125rem",
                        "md": "0.25rem",
                        "lg": "0.375rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        "soft": "0 2px 15px -3px rgba(0, 0, 0, 0.03), 0 4px 6px -2px rgba(0, 0, 0, 0.01)",
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#111418] dark:text-white min-h-screen flex flex-col antialiased selection:bg-primary/20 selection:text-primary">
<!-- Minimal Header -->
<header class="w-full px-6 py-4 flex items-center justify-between absolute top-0 left-0 z-10">
<div class="flex items-center gap-3 cursor-pointer">
<div class="size-8 text-primary">
<svg fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M4 42.4379C4 42.4379 14.0962 36.0744 24 41.1692C35.0664 46.8624 44 42.2078 44 42.2078L44 7.01134C44 7.01134 35.068 11.6577 24.0031 5.96913C14.0971 0.876274 4 7.27094 4 7.27094L4 42.4379Z" fill="currentColor"></path>
</svg>
</div>
<h2 class="text-[#111418] dark:text-white text-lg font-bold tracking-tight">Holly Search</h2>
</div>
<a class="text-sm font-medium text-[#617589] dark:text-gray-400 hover:text-primary dark:hover:text-primary transition-colors" href="#">
            Yardım
        </a>
</header>
<!-- Main Centered Content -->
<main class="flex-1 flex items-center justify-center p-4 sm:p-6">
<div class="w-full max-w-[440px] bg-white dark:bg-[#1A2633] rounded shadow-soft border border-[#e5e7eb] dark:border-[#2a3b4d] flex flex-col overflow-hidden relative">
<!-- Decorative Top Line -->
<div class="absolute top-0 left-0 w-full h-1 bg-primary"></div>
<div class="px-8 pt-10 pb-8 flex flex-col gap-6">
<!-- Heading Group -->
<div class="flex flex-col gap-2 text-center mb-2">
<h1 class="text-2xl font-bold tracking-tight text-[#111418] dark:text-white">Hesabınızı Oluşturun</h1>
<p class="text-sm text-[#617589] dark:text-gray-400 font-normal">Kutsal metinleri keşfetmeye ve öğrenmeye başlayın.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-5">
<!-- Name Input -->
<div class="flex flex-col gap-1.5">
<label class="text-sm font-medium text-[#111418] dark:text-gray-200" for="fullname">Ad Soyad</label>
<input class="form-input w-full h-11 px-4 bg-white dark:bg-[#1A2633] border border-[#d1d5db] dark:border-[#374151] rounded text-base text-[#111418] dark:text-white placeholder-[#9ca3af] focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all shadow-sm" id="fullname" placeholder="Adınız ve Soyadınız" type="text"/>
</div>
<!-- Email Input -->
<div class="flex flex-col gap-1.5">
<label class="text-sm font-medium text-[#111418] dark:text-gray-200" for="email">E-posta Adresi</label>
<input class="form-input w-full h-11 px-4 bg-white dark:bg-[#1A2633] border border-[#d1d5db] dark:border-[#374151] rounded text-base text-[#111418] dark:text-white placeholder-[#9ca3af] focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all shadow-sm" id="email" placeholder="isim@ornek.com" type="email"/>
<!-- Example Error State (Hidden by default, structure ready) -->
<span class="hidden text-xs text-red-500 font-medium mt-0.5">Lütfen geçerli bir e-posta adresi giriniz.</span>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center">
<label class="text-sm font-medium text-[#111418] dark:text-gray-200" for="password">Şifre</label>
</div>
<div class="relative flex items-center">
<input class="form-input w-full h-11 pl-4 pr-10 bg-white dark:bg-[#1A2633] border border-[#d1d5db] dark:border-[#374151] rounded text-base text-[#111418] dark:text-white placeholder-[#9ca3af] focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all shadow-sm" id="password" placeholder="********" type="password"/>
<button class="absolute right-3 text-[#9ca3af] hover:text-[#617589] dark:hover:text-white transition-colors flex items-center justify-center p-1 rounded" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
<p class="text-xs text-[#617589] dark:text-gray-500">En az 8 karakter olmalıdır.</p>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-3 mt-1">
<div class="flex h-5 items-center">
<input class="size-4 rounded border-gray-300 text-primary focus:ring-primary dark:border-gray-600 dark:bg-gray-700" id="terms" name="terms" type="checkbox"/>
</div>
<div class="text-sm leading-5">
<label class="font-normal text-[#617589] dark:text-gray-400" for="terms">
<a class="font-medium text-primary hover:text-primary/80 underline decoration-1 underline-offset-2 transition-colors" href="#">Kullanım Koşullarını</a> 
                                ve 
                                <a class="font-medium text-primary hover:text-primary/80 underline decoration-1 underline-offset-2 transition-colors" href="#">Gizlilik Politikasını</a> 
                                okudum ve kabul ediyorum.
                            </label>
</div>
</div>
<!-- Submit Button -->
<button class="flex w-full items-center justify-center rounded h-11 px-4 bg-primary hover:bg-primary/90 active:bg-primary/95 text-white text-sm font-bold tracking-wide transition-all shadow-sm mt-2">
                        Kayıt Ol
                    </button>
</form>
<!-- Footer Divider -->
<div class="relative flex py-1 items-center">
<div class="flex-grow border-t border-[#e5e7eb] dark:border-[#374151]"></div>
</div>
<!-- Sign In Link -->
<div class="text-center">
<p class="text-sm text-[#617589] dark:text-gray-400">
                        Zaten hesabınız var mı? 
                        <a class="font-semibold text-primary hover:text-primary/80 transition-colors ml-1" href="#">Giriş Yap</a>
</p>
</div>
</div>
</div>
<!-- Subtle Background Pattern/Illustration Area (Optional, abstract) -->
<div class="fixed bottom-0 left-0 w-full h-1/2 -z-10 bg-gradient-to-t from-gray-100 to-transparent dark:from-[#0b1219] dark:to-transparent pointer-events-none opacity-50"></div>
</main>
</body></html>
