<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Holly Search - Giriş Yap</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#007bff",
              "primary-hover": "#0062cc",
              "background-light": "#f8f9fa",
              "background-dark": "#0f1923",
              "surface-light": "#ffffff",
              "surface-dark": "#1a2733",
              "border-light": "#e2e8f0",
              "border-dark": "#2d3b48",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"],
              "body": ["Inter", "sans-serif"],
            },
            borderRadius: {
              "DEFAULT": "2px",
              "sm": "2px",
              "md": "4px",
              "lg": "8px",
            },
            boxShadow: {
              'subtle': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
            }
          },
        },
      }
    </script>
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-[#101418] dark:text-white antialiased min-h-screen flex flex-col">
<!-- Minimal Header -->
<header class="w-full bg-surface-light dark:bg-surface-dark border-b border-border-light dark:border-border-dark py-4 px-6 md:px-10 flex items-center justify-between sticky top-0 z-10">
<div class="flex items-center gap-3">
<div class="size-8 text-primary flex items-center justify-center">
<span class="material-symbols-outlined text-[32px]">auto_stories</span>
</div>
<h1 class="text-xl font-bold tracking-tight text-[#101418] dark:text-white">Holly Search</h1>
</div>
<div class="hidden sm:block">
<a class="text-sm font-medium text-slate-500 hover:text-primary transition-colors dark:text-slate-400 dark:hover:text-primary" href="#">Yardım Merkezi</a>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex items-center justify-center p-4 sm:p-6 lg:p-8">
<div class="w-full max-w-[440px] bg-surface-light dark:bg-surface-dark shadow-subtle border border-border-light dark:border-border-dark rounded-sm overflow-hidden p-8 sm:p-10 transition-all duration-300 hover:shadow-lg">
<!-- Headline & Body Text -->
<div class="text-center mb-8">
<h2 class="text-3xl font-bold tracking-tight text-[#101418] dark:text-white mb-2">Giriş Yap</h2>
<p class="text-slate-500 dark:text-slate-400 text-sm">Holly Search'ün derinliklerine hoş geldiniz.</p>
</div>
<form class="space-y-5" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="group">
<label class="block text-sm font-medium text-[#101418] dark:text-slate-200 mb-1.5" for="email">E-posta</label>
<div class="relative">
<input class="form-input block w-full rounded-sm border-border-light dark:border-border-dark bg-white dark:bg-[#0f1923] text-[#101418] dark:text-white py-3 px-4 placeholder:text-slate-400 focus:border-primary focus:ring-1 focus:ring-primary transition-colors duration-200 sm:text-sm" id="email" placeholder="ad@domain.com" type="email"/>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none opacity-0 group-focus-within:opacity-100 transition-opacity duration-200">
<span class="material-symbols-outlined text-primary text-lg">mail</span>
</div>
</div>
</div>
<!-- Password Field -->
<div class="group">
<div class="flex items-center justify-between mb-1.5">
<label class="block text-sm font-medium text-[#101418] dark:text-slate-200" for="password">Şifre</label>
<a class="text-xs font-medium text-primary hover:text-primary-hover transition-colors" href="#">Şifremi Unuttum?</a>
</div>
<div class="relative">
<input class="form-input block w-full rounded-sm border-border-light dark:border-border-dark bg-white dark:bg-[#0f1923] text-[#101418] dark:text-white py-3 px-4 placeholder:text-slate-400 focus:border-primary focus:ring-1 focus:ring-primary transition-colors duration-200 sm:text-sm" id="password" placeholder="••••••••" type="password"/>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none opacity-0 group-focus-within:opacity-100 transition-opacity duration-200">
<span class="material-symbols-outlined text-primary text-lg">lock</span>
</div>
</div>
</div>
<!-- Primary Button -->
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-sm shadow-sm text-sm font-semibold text-white bg-primary hover:bg-primary-hover hover:-translate-y-0.5 active:translate-y-0 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-200 ease-out" type="submit">
                    GİRİŞ YAP
                </button>
</form>
<!-- Divider -->
<div class="relative mt-8 mb-6">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-border-light dark:border-border-dark"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-surface-light dark:bg-surface-dark text-slate-500">veya şununla devam et</span>
</div>
</div>
<!-- Social Login -->
<div class="grid grid-cols-2 gap-3">
<button class="flex items-center justify-center w-full px-4 py-2.5 border border-border-light dark:border-border-dark rounded-sm bg-white dark:bg-[#0f1923] text-sm font-medium text-[#101418] dark:text-white hover:bg-gray-50 dark:hover:bg-gray-800 hover:border-gray-300 dark:hover:border-gray-600 transition-all duration-200 group" type="button">
<svg class="h-5 w-5 mr-2 group-hover:scale-110 transition-transform duration-200" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Google
                </button>
<button class="flex items-center justify-center w-full px-4 py-2.5 border border-border-light dark:border-border-dark rounded-sm bg-white dark:bg-[#0f1923] text-sm font-medium text-[#101418] dark:text-white hover:bg-gray-50 dark:hover:bg-gray-800 hover:border-gray-300 dark:hover:border-gray-600 transition-all duration-200 group" type="button">
<svg class="h-5 w-5 mr-2 text-black dark:text-white group-hover:scale-110 transition-transform duration-200" fill="currentColor" viewbox="0 0 24 24">
<path d="M17.05 20.28c-.98.95-2.05.88-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.77 3.4 1.86-3.04 1.83-2.52 6.09.56 7.31-.24.75-.54 1.72-1.06 2.67-.52.93-1.07 1.86-1.55 1.17zm-4.32-15.3c.3.93-.8 2.08-1.74 2.06-1.12.08-2.31-1.07-2.06-2.37.05-1.11 1.56-2.06 2.45-1.89.84.05 1.16 1.48 1.35 2.2z"></path>
</svg>
                    Apple
                </button>
</div>
<!-- Footer Link -->
<p class="mt-8 text-center text-sm text-slate-500 dark:text-slate-400">
                Hesabın yok mu? 
                <a class="font-semibold text-primary hover:text-primary-hover hover:underline transition-all" href="#">Kayıt Ol</a>
</p>
</div>
</main>
<!-- Simple Footer for Legal/Copyright -->
<footer class="w-full py-6 text-center">
<p class="text-xs text-slate-400 dark:text-slate-500">
            © 2024 Holly Search. Tüm hakları saklıdır. <a class="hover:text-primary ml-2" href="#">Gizlilik Politikası</a> · <a class="hover:text-primary ml-1" href="#">Kullanım Şartları</a>
</p>
</footer>
</body></html>
