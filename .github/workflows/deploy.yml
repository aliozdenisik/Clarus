# =============================================================================
# Clarus — Continuous Deployment to Production VPS
# Trigger: PR merged to main
# Strategy: SSH → git pull → write env → build → rolling restart → health check
#
# All environment variables are sourced from GitHub Secrets.
# To update a production config value, change the corresponding secret at:
#   https://github.com/aliozdenisik/Clarus/settings/secrets/actions
# =============================================================================

name: Deploy to Production

on:
  push:
    branches: [main]

# Prevent concurrent deployments
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    # Only deploy on actual merges, not direct pushes (safety net)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          # --- Secrets forwarded to VPS via appleboy/ssh-action envs ---
          # Database
          BACKEND_DATABASE_URL: ${{ secrets.BACKEND_DATABASE_URL }}
          FRONTEND_DATABASE_URL: ${{ secrets.FRONTEND_DATABASE_URL }}
          # API Keys
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Auth
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # Billing (Polar.sh)
          POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
          POLAR_WEBHOOK_SECRET: ${{ secrets.POLAR_WEBHOOK_SECRET }}
          POLAR_STARTER_PRODUCT_ID: ${{ secrets.POLAR_STARTER_PRODUCT_ID }}
          POLAR_PRO_PRODUCT_ID: ${{ secrets.POLAR_PRO_PRODUCT_ID }}
          # Observability (Sentry)
          SENTRY_DSN_BACKEND: ${{ secrets.SENTRY_DSN_BACKEND }}
          SENTRY_DSN_FRONTEND: ${{ secrets.SENTRY_DSN_FRONTEND }}
          # Email (SMTP)
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          # Redis
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 8m
          envs: BACKEND_DATABASE_URL,FRONTEND_DATABASE_URL,OPENROUTER_API_KEY,JWT_SECRET_KEY,BETTER_AUTH_SECRET,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,POLAR_ACCESS_TOKEN,POLAR_WEBHOOK_SECRET,POLAR_STARTER_PRODUCT_ID,POLAR_PRO_PRODUCT_ID,SENTRY_DSN_BACKEND,SENTRY_DSN_FRONTEND,SMTP_USER,SMTP_PASSWORD,SMTP_FROM,REDIS_PASSWORD
          script: |
            set -euo pipefail

            APP_DIR="/opt/clarus"
            DEPLOY_LOG="/var/log/clarus-deploy.log"
            TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

            echo "[$TIMESTAMP] === Deploy started ===" | tee -a "$DEPLOY_LOG"

            # --- 1. Git pull ---
            cd "$APP_DIR"
            echo "[$TIMESTAMP] Pulling latest changes..." | tee -a "$DEPLOY_LOG"
            git fetch origin main
            git reset --hard origin/main
            echo "Commit: $(git rev-parse --short HEAD)" | tee -a "$DEPLOY_LOG"

            # --- 2. Write backend/.env from GitHub Secrets ---
            echo "[$TIMESTAMP] Writing backend/.env from secrets..." | tee -a "$DEPLOY_LOG"
            cat > "$APP_DIR/backend/.env" << 'ENVEOF'
            # Auto-generated by GitHub Actions — do not edit manually.
            # Change values at: https://github.com/aliozdenisik/Clarus/settings/secrets/actions

            # OpenRouter API Key
            OPENROUTER_API_KEY=__OPENROUTER_API_KEY__

            # Database
            DATABASE_URL=__BACKEND_DATABASE_URL__
            JWT_SECRET_KEY=__JWT_SECRET_KEY__
            JWT_ALGORITHM=HS256
            JWT_ACCESS_EXPIRE_MINUTES=1440
            JWT_REFRESH_EXPIRE_MINUTES=43200

            # Google OAuth
            GOOGLE_CLIENT_ID=__GOOGLE_CLIENT_ID__
            GOOGLE_CLIENT_SECRET=__GOOGLE_CLIENT_SECRET__
            GOOGLE_REDIRECT_URI=https://clarus.hollysearch.com/api/auth/google/callback

            # Better Auth
            BETTER_AUTH_JWKS_URL=https://clarus.hollysearch.com/api/auth/jwks
            BETTER_AUTH_ISSUER=https://clarus.hollysearch.com

            # Rate Limiting
            RATE_LIMIT_PER_DAY=50
            RATE_LIMIT_ENABLED=true

            # CORS
            CORS_ORIGINS=https://clarus.hollysearch.com
            CORS_ALLOW_CREDENTIALS=true

            # Query Validation
            QUERY_MAX_LENGTH=500
            QUERY_MIN_LENGTH=1

            # Environment
            APP_ENV=production
            DEBUG=false

            # Logging
            LOG_FORMAT=json
            LOG_LEVEL=INFO

            # Redis
            REDIS_HOST=localhost
            REDIS_PORT=6379
            REDIS_PASSWORD=__REDIS_PASSWORD__

            # Sentry
            SENTRY_ENABLED=true
            SENTRY_DSN_BACKEND=__SENTRY_DSN_BACKEND__
            SENTRY_ENVIRONMENT=production
            SENTRY_TRACES_SAMPLE_RATE=0.2

            # Polar.sh (billing & subscriptions)
            POLAR_ACCESS_TOKEN=__POLAR_ACCESS_TOKEN__
            POLAR_WEBHOOK_SECRET=__POLAR_WEBHOOK_SECRET__
            POLAR_SERVER=production
            POLAR_STARTER_PRODUCT_ID=__POLAR_STARTER_PRODUCT_ID__
            POLAR_PRO_PRODUCT_ID=__POLAR_PRO_PRODUCT_ID__
            POLAR_ORG_SLUG=claruss
            ENVEOF

            # Replace placeholders with actual secret values (safe for $, `, \ in values)
            sed -i \
              -e "s|__OPENROUTER_API_KEY__|${OPENROUTER_API_KEY}|g" \
              -e "s|__BACKEND_DATABASE_URL__|${BACKEND_DATABASE_URL}|g" \
              -e "s|__JWT_SECRET_KEY__|${JWT_SECRET_KEY}|g" \
              -e "s|__GOOGLE_CLIENT_ID__|${GOOGLE_CLIENT_ID}|g" \
              -e "s|__GOOGLE_CLIENT_SECRET__|${GOOGLE_CLIENT_SECRET}|g" \
              -e "s|__REDIS_PASSWORD__|${REDIS_PASSWORD}|g" \
              -e "s|__SENTRY_DSN_BACKEND__|${SENTRY_DSN_BACKEND}|g" \
              -e "s|__POLAR_ACCESS_TOKEN__|${POLAR_ACCESS_TOKEN}|g" \
              -e "s|__POLAR_WEBHOOK_SECRET__|${POLAR_WEBHOOK_SECRET}|g" \
              -e "s|__POLAR_STARTER_PRODUCT_ID__|${POLAR_STARTER_PRODUCT_ID}|g" \
              -e "s|__POLAR_PRO_PRODUCT_ID__|${POLAR_PRO_PRODUCT_ID}|g" \
              "$APP_DIR/backend/.env"
            chmod 600 "$APP_DIR/backend/.env"

            # --- 3. Write frontend/.env.local from GitHub Secrets ---
            echo "[$TIMESTAMP] Writing frontend/.env.local from secrets..." | tee -a "$DEPLOY_LOG"
            cat > "$APP_DIR/frontend/.env.local" << 'ENVEOF'
            # Auto-generated by GitHub Actions — do not edit manually.
            # Change values at: https://github.com/aliozdenisik/Clarus/settings/secrets/actions

            # Sentry
            NEXT_PUBLIC_SENTRY_DSN=__SENTRY_DSN_FRONTEND__
            SENTRY_ORG=sentry
            SENTRY_PROJECT=clarus-frontend

            # Logging
            NEXT_PUBLIC_LOG_LEVEL=warn

            # Better Auth
            BETTER_AUTH_SECRET=__BETTER_AUTH_SECRET__
            BETTER_AUTH_URL=https://clarus.hollysearch.com
            DATABASE_URL=__FRONTEND_DATABASE_URL__

            # Google OAuth
            GOOGLE_CLIENT_ID=__GOOGLE_CLIENT_ID__
            GOOGLE_CLIENT_SECRET=__GOOGLE_CLIENT_SECRET__

            # API
            NEXT_PUBLIC_API_URL=https://clarus.hollysearch.com
            NEXT_PUBLIC_BETTER_AUTH_URL=https://clarus.hollysearch.com

            # Polar.sh (billing & subscriptions)
            POLAR_ACCESS_TOKEN=__POLAR_ACCESS_TOKEN__
            POLAR_WEBHOOK_SECRET=__POLAR_WEBHOOK_SECRET__
            POLAR_SERVER=production
            POLAR_STARTER_PRODUCT_ID=__POLAR_STARTER_PRODUCT_ID__
            POLAR_PRO_PRODUCT_ID=__POLAR_PRO_PRODUCT_ID__
            POLAR_ORG_SLUG=claruss

            # Email (SMTP)
            SMTP_HOST=smtp.gmail.com
            SMTP_PORT=587
            SMTP_USER=__SMTP_USER__
            SMTP_PASSWORD=__SMTP_PASSWORD__
            SMTP_FROM=__SMTP_FROM__
            ENVEOF

            # Replace placeholders with actual secret values (safe for $, `, \ in values)
            sed -i \
              -e "s|__SENTRY_DSN_FRONTEND__|${SENTRY_DSN_FRONTEND}|g" \
              -e "s|__BETTER_AUTH_SECRET__|${BETTER_AUTH_SECRET}|g" \
              -e "s|__FRONTEND_DATABASE_URL__|${FRONTEND_DATABASE_URL}|g" \
              -e "s|__GOOGLE_CLIENT_ID__|${GOOGLE_CLIENT_ID}|g" \
              -e "s|__GOOGLE_CLIENT_SECRET__|${GOOGLE_CLIENT_SECRET}|g" \
              -e "s|__POLAR_ACCESS_TOKEN__|${POLAR_ACCESS_TOKEN}|g" \
              -e "s|__POLAR_WEBHOOK_SECRET__|${POLAR_WEBHOOK_SECRET}|g" \
              -e "s|__POLAR_STARTER_PRODUCT_ID__|${POLAR_STARTER_PRODUCT_ID}|g" \
              -e "s|__POLAR_PRO_PRODUCT_ID__|${POLAR_PRO_PRODUCT_ID}|g" \
              -e "s|__SMTP_USER__|${SMTP_USER}|g" \
              -e "s|__SMTP_PASSWORD__|${SMTP_PASSWORD}|g" \
              -e "s|__SMTP_FROM__|${SMTP_FROM}|g" \
              "$APP_DIR/frontend/.env.local"
            chmod 600 "$APP_DIR/frontend/.env.local"

            # --- 4. Backend: check for dependency changes ---
            if git diff HEAD~1 --name-only | grep -q "backend/pyproject.toml\|backend/uv.lock"; then
              echo "[$TIMESTAMP] Backend deps changed, syncing..." | tee -a "$DEPLOY_LOG"
              cd "$APP_DIR/backend"
              .venv/bin/python -m pip install --upgrade pip -q
              /root/.local/bin/uv sync --frozen 2>/dev/null || .venv/bin/pip install -r requirements.txt -q
            fi

            # --- 5. Frontend: install deps if needed + build ---
            cd "$APP_DIR/frontend"
            if git diff HEAD~1 --name-only | grep -q "frontend/package.json\|frontend/package-lock.json"; then
              echo "[$TIMESTAMP] Frontend deps changed, installing..." | tee -a "$DEPLOY_LOG"
              npm ci --production=false
            fi

            echo "[$TIMESTAMP] Building frontend..." | tee -a "$DEPLOY_LOG"
            npm run build

            # --- 6. Rolling restart (backend first, then frontend) ---
            echo "[$TIMESTAMP] Restarting backend..." | tee -a "$DEPLOY_LOG"
            systemctl restart clarus-backend
            sleep 3

            echo "[$TIMESTAMP] Restarting frontend..." | tee -a "$DEPLOY_LOG"
            systemctl restart clarus-frontend
            sleep 5

            # --- 7. Health checks ---
            echo "[$TIMESTAMP] Running health checks..." | tee -a "$DEPLOY_LOG"

            BACKEND_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/health || echo "000")
            FRONTEND_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://127.0.0.1:3000 || echo "000")

            if [ "$BACKEND_STATUS" = "200" ] && [ "$FRONTEND_STATUS" = "307" -o "$FRONTEND_STATUS" = "200" ]; then
              echo "[$TIMESTAMP] ✅ Deploy successful! Backend=$BACKEND_STATUS Frontend=$FRONTEND_STATUS" | tee -a "$DEPLOY_LOG"
            else
              echo "[$TIMESTAMP] ❌ Health check FAILED! Backend=$BACKEND_STATUS Frontend=$FRONTEND_STATUS" | tee -a "$DEPLOY_LOG"
              echo "Checking service logs..." | tee -a "$DEPLOY_LOG"
              journalctl -u clarus-backend --no-pager -n 10 | tee -a "$DEPLOY_LOG"
              journalctl -u clarus-frontend --no-pager -n 10 | tee -a "$DEPLOY_LOG"
              exit 1
            fi

            echo "[$TIMESTAMP] === Deploy completed ===" | tee -a "$DEPLOY_LOG"
