# GitHub Actions Workflow: Security Scanning
# Scans for vulnerabilities in dependencies and code

name: Security Scanning

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: "0 0 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # Dependency vulnerability scanning
  dependency-scan:
    runs-on: ubuntu-latest
    name: Dependency Vulnerability Scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit safety

      - name: Run pip-audit
        run: |
          pip-audit -r requirements.txt --desc on || true

      - name: Run Safety check
        run: |
          safety check -r requirements.txt --full-report || true

  # CodeQL Analysis for code vulnerabilities
  codeql-analysis:
    runs-on: ubuntu-latest
    name: CodeQL Analysis

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  # Secret scanning and sensitive data check
  secret-scan:
    runs-on: ubuntu-latest
    name: Secret Scanning

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.0/gitleaks_8.18.0_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.0_linux_x64.tar.gz
          chmod +x gitleaks

      - name: Run Gitleaks
        run: |
          ./gitleaks detect --source . --verbose || true

      - name: Check for common security issues
        run: |
          echo "🔍 Checking for common security issues..."

          # Check for hardcoded API keys
          if grep -r "api_key\s*=\s*['\"][a-zA-Z0-9]" --include="*.py" . 2>/dev/null; then
            echo "⚠️ Warning: Possible hardcoded API keys found"
          else
            echo "✅ No obvious hardcoded API keys detected"
          fi

          # Check for .env files in version control
          if [ -f ".env" ] && ! grep -q "^\.env$" .gitignore 2>/dev/null; then
            echo "⚠️ Warning: .env file may not be in .gitignore"
          else
            echo "✅ .env handling looks correct"
          fi
