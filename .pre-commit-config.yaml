# Industry-standard pre-commit hooks for Clarus (Python FastAPI + Next.js 15)
# Install: pre-commit install && pre-commit install --hook-type pre-push
# Run all: pre-commit run --all-files
# Skip:    SKIP=pyright-backend git commit -m "message"

default_language_version:
  python: python3.11

fail_fast: false

repos:
  # ===== GLOBAL: File Quality =====
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        files: \.(py|ts|tsx|js|jsx|md|yaml|yml|json|toml|css)$
      - id: end-of-file-fixer
        files: \.(py|ts|tsx|js|jsx|md|yaml|yml|json|toml|css)$
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
        exclude: ^frontend/(package-lock\.json|\.next/|out/)
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-ast
        files: ^backend/.*\.py$
      - id: debug-statements
        files: ^backend/.*\.py$
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]

  # ===== GLOBAL: Secret Detection =====
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ===== GLOBAL: Typo Detection =====
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args:
          - --ignore-words-list=crate,nd,sav,te,als,ot,fo,sur,mis,nwe,socio,thre,wor,datas,bu,sistem,standart,paralel,grup,nin,sade,segmente,analize,outter,theses,sems,stil,fusha,sizin,vai,sme,shema
          - --skip=*.json,*.lock,*.min.js,*.min.css,*.svg,frontend/.next/*,backend/.venv/*
        exclude: ^(frontend/lib/api/|qdrant_data/|postgres_data/|backend/data/|backend/scripts/|backend/tests/archive/|Araştırmalar/)

  # ===== BACKEND: Python Linting (replaces standalone bandit via S rules) =====
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.7
    hooks:
      - id: ruff
        name: ruff lint (backend)
        args: [--fix, --exit-non-zero-on-fix]
        files: ^backend/
        exclude: ^backend/(postgres_data|qdrant_data|\.venv|__pycache__)/
      - id: ruff-format
        name: ruff format (backend)
        files: ^backend/
        exclude: ^backend/(postgres_data|qdrant_data|\.venv|__pycache__)/

  # ===== BACKEND: Type Checking (pre-push only — slow) =====
  - repo: local
    hooks:
      - id: pyright-backend
        name: pyright type check (backend)
        entry: bash -c 'cd backend && uv run pyright'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
        require_serial: true
        stages: [pre-push]

  # ===== FRONTEND: ESLint =====
  - repo: local
    hooks:
       - id: eslint-frontend
         name: eslint (frontend)
         entry: bash -c 'cd frontend && npx eslint --fix --max-warnings=0'
         language: system
         files: ^frontend/.*\.(ts|tsx|js|jsx)$
         exclude: (node_modules|\.next|out)|lib/api/.*\.gen\.ts
         pass_filenames: false

  # ===== FRONTEND: Prettier =====
  - repo: local
    hooks:
       - id: prettier-frontend
         name: prettier (frontend)
         entry: bash -c 'cd frontend && npx prettier --check .'
         language: system
         files: ^frontend/.*\.(ts|tsx|js|jsx|json|css|md)$
         exclude: (node_modules|\.next|out)|lib/api/.*\.gen\.ts
         pass_filenames: false

  # ===== FRONTEND: TypeScript Check (pre-push only — slow) =====
  - repo: local
    hooks:
      - id: tsc-frontend
        name: tsc type check (frontend)
        entry: bash -c 'cd frontend && npx tsc --noEmit'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        exclude: ^frontend/(node_modules|\.next|out)/
        pass_filenames: false
        require_serial: true
        stages: [pre-push]
